  <script>
    (function() {
      const hostname = window.location.hostname.toLowerCase();
      let measurementId = '';

      if (
        hostname === 'www.zeroshare.dippanbhusal.tech' ||
        hostname === 'zeroshare.dippanbhusal.tech'
      ) {
        measurementId = 'G-XTSQ4BN2E0';
      } else if (hostname === 'zeroshare-io.vercel.app') {
        measurementId = 'G-4TK1W8M38E';
      }

      if (measurementId) {
        const gtagScript = document.createElement('script');

        gtagScript.async = true;
        gtagScript.src =
          'https://www.googletagmanager.com/gtag/js?id=' + measurementId;

        document.head.appendChild(gtagScript);

        window.dataLayer = window.dataLayer || [];

        function gtag() {
          dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', measurementId);

        console.log(
          'Analytics initialized for: ' + measurementId
        );
      }
    })();
  </script>

    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "name": "ZeroShare",
        "url": "https://zeroshare-io.vercel.app/",
        "description": "ZeroShare is a browser-based peer-to-peer file transfer tool using WebRTC and AES-256-GCM encryption.",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires WebRTC and Web Crypto API support.",
        "author": {
          "@type": "Person",
          "name": "Dippan Bhusal",
          "url": "https://dippanbhusal.tech",
          "sameAs": [
            "https://github.com/kdippan",
            "https://linkedin.com/in/kdippan"
          ]
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is there a file size limit on ZeroShare?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ZeroShare supports large file transfers, subject to the browser, available memory, storage, and network conditions."
            }
          },
          {
            "@type": "Question",
            "name": "Can ZeroShare or its developers see my files?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Files are encrypted locally in the browser using AES-256-GCM before being transferred between peers."
            }
          }
        ]
      }
    ]
  }
  </script>

<body data-theme="dark">

  <div class="ambient-background"></div>

  <nav class="navbar">
    <div class="container nav-container">

      <a href="/" class="brand">
        <i data-lucide="zap" class="brand-icon"></i>
        <span>ZeroShare</span>
      </a>

      <div class="nav-links">
        <button id="tabApp" class="nav-btn active">
          App
        </button>

        <button id="tabHistory" class="nav-btn">
          History
        </button>
      </div>

      <div class="status-badge" id="connectionStatus">
        <span class="dot disconnected"></span>
        Waiting...
      </div>

    </div>
  </nav>

  <main class="container">

    <div id="appView">

      <header class="page-header">
        <h1 class="gradient-text">
          E2EE File Drop
        </h1>
      </header>

      <article class="card glass-panel" id="mainPanel">

        <div id="setupSection" class="section-active">

          <h2 class="section-title">
            <i data-lucide="link"></i>
            Secure Connection
          </h2>

          <div class="id-display-box">
            <span>Your ID:</span>

            <strong id="myPeerId">
              Generating...
            </strong>

            <button
              class="icon-btn"
              id="copyIdBtn"
              type="button"
              aria-label="Copy peer ID"
            >
              <i data-lucide="copy"></i>
            </button>
          </div>

          <div class="input-group connection-input-group">

            <label for="targetPeerId">
              Connect to Peer
            </label>

            <div class="connection-input">

              <input
                type="text"
                id="targetPeerId"
                placeholder="Paste ID..."
                autocomplete="off"
                spellcheck="false"
              >

              <button
                id="connectBtn"
                class="btn-primary"
                type="button"
              >
                Connect
              </button>

            </div>

          </div>

        </div>


        <div id="transferSection" style="display: none;">

          <h2 class="section-title">
            <i data-lucide="lock"></i>
            Secure Transfer
          </h2>


          <div class="connection-peer">

            <div class="connection-peer-icon">
              <i data-lucide="shield-check"></i>
            </div>

            <div class="connection-peer-info">
              <span>
                Connected securely to
              </span>

              <strong id="connectedPeerId">
                Peer
              </strong>
            </div>

            <span class="connection-live">
              <span class="dot connected"></span>
              Connected
            </span>

          </div>


          <div class="file-upload-wrapper">

            <input
              type="file"
              id="fileInput"
              aria-label="Select file to send"
            >

            <div class="file-upload-visual">

              <i data-lucide="upload-cloud"></i>

              <strong>
                Select a file
              </strong>

              <span>
                Encrypted locally before transfer
              </span>

            </div>

          </div>


          <div
            id="transferActivity"
            class="transfer-activity"
            aria-live="polite"
          ></div>

        </div>

      </article>

    </div>


    <div id="historyView" style="display: none;">

      <header class="page-header">
        <h1 class="gradient-text">
          Activity Log
        </h1>
      </header>


      <article class="card glass-panel">

        <div class="history-header">

          <h2 class="section-title">
            <i data-lucide="clock"></i>
            Recent Transfers
          </h2>

          <button
            id="clearHistoryBtn"
            class="icon-btn history-delete-btn"
            type="button"
            aria-label="Clear transfer history"
          >
            <i data-lucide="trash-2"></i>
          </button>

        </div>


        <div
          id="historyList"
          class="history-list"
        ></div>

      </article>

    </div>

  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {

        navigator.serviceWorker.register('/services.js')
          .then(reg => {
            console.log(
              'Service Worker registered!',
              reg
            );
          })
          .catch(err => {
            console.error(
              'Service Worker registration failed:',
              err
            );
          });

      });
    }
  </script>
